apiVersion: apps/v1
kind: Deployment

metadata:
  name: web-app

spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app

    spec:
      containers:
        - name: webapp

          image: lutrp/goodfood-webapp
          imagePullPolicy: "Always"

          resources:
            limits:
              cpu: 100m
              memory: 200Mi

          ports:
            - containerPort: 3000